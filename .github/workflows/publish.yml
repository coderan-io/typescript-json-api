name: Publish

on:
    push:
        tags: ['v*']

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # npm trusted publishing (OIDC) + provenance
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 26
                  registry-url: https://registry.npmjs.org
            - name: Tag matches package.json version
              run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
            - run: npm ci
            - run: npm run lint && npm run format:check
            - run: npm publish --access public # prepublishOnly runs build + test
